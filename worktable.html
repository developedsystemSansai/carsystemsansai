<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางเวรยานพาหนะ — โรงพยาบาลสันทราย</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ ROOT — ตรงกับ index.html ════════════════════════════════ */
:root {
  --navy:         #0d2137;
  --navy-mid:     #163251;
  --navy-light:   #1e4a7a;
  --blue:         #1d6fb5;
  --blue-soft:    #e8f1fb;
  --teal:         #007a6e;
  --teal-soft:    #e0f4f1;
  --amber:        #c07a00;
  --amber-soft:   #fdf4dc;
  --orange:       #d4580a;
  --orange-soft:  #fdf0e6;
  --red:          #c0392b;
  --red-soft:     #fdecea;
  --bg:           #eef2f7;
  --bg2:          #e4eaf3;
  --card:         #ffffff;
  --border:       #d5dce8;
  --border-strong:#b8c4d4;
  --text:         #182332;
  --text-mid:     #3d5168;
  --text-light:   #7a8ea5;
  --success:      #1a8a4a;
  --success-soft: #e4f5eb;
  --warning:      #c07a00;
  --warning-soft: #fdf4dc;
  --danger:       #c0392b;
  --danger-soft:  #fdecea;
  --violet:       #6d3fc0;
  --violet-soft:  #f0ecfb;
  --violet-mid:   #8255d4;
  --green:        #1a8a4a;
  --green-soft:   #e4f5eb;
  --radius:       12px;
  --radius-sm:    8px;
  --shadow-sm:    0 1px 6px rgba(13,33,55,.07);
  --shadow:       0 2px 14px rgba(13,33,55,.09);
  --shadow-lg:    0 6px 32px rgba(13,33,55,.13);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans Thai', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ═══ HEADER — เหมือน index.html ══════════════════════════════ */
.site-header {
  background: linear-gradient(160deg, var(--navy-mid) 0%, #1a3f6a 55%, #173660 100%);
  padding: 0 20px;
  border-bottom: 2px solid rgba(255,255,255,.06);
  box-shadow: 0 2px 16px rgba(13,33,55,.35);
  position: sticky; top: 0; z-index: 200;
}
.header-inner {
  max-width: 900px; margin: 0 auto;
  height: 64px; display: flex; align-items: center; gap: 14px;
}
.header-logo-wrap {
  width: 40px; height: 40px; border-radius: 10px;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-logo-wrap svg { width: 22px; height: 22px; color: #fff; }
.header-titles { flex: 1; min-width: 0; }
.main-title {
  font-size: 14px; font-weight: 700; color: #fff;
  line-height: 1.25; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.sub-title { font-size: 10.5px; color: rgba(255,255,255,.5); margin-top: 2px; }
.header-chip {
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.7); font-size: 10px; font-weight: 600;
  padding: 3px 9px; border-radius: 20px; flex-shrink: 0;
}

/* ═══ TODAY STRIP ══════════════════════════════════════════════ */
.today-strip {
  background: linear-gradient(90deg, var(--green) 0%, #22a55a 100%);
  padding: 10px 20px;
  display: none; align-items: center; gap: 12px;
}
.today-strip.show { display: flex; }
.ts-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #69f0ae; flex-shrink: 0;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.ts-text { font-size: 12.5px; font-weight: 700; color: #fff; }
.ts-sub { font-size: 11px; color: rgba(255,255,255,.75); margin-top: 1px; }
.ts-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.ts-chip {
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
  color: #fff; font-size: 10.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 20px;
  display: flex; align-items: center; gap: 4px;
}
.ts-chip.ems { background: rgba(192,57,43,.5); border-color: rgba(255,150,150,.4); }

/* ═══ TAB BAR ══════════════════════════════════════════════════ */
.tab-bar {
  background: var(--card); border-bottom: 1.5px solid var(--border);
  overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  position: sticky; top: 64px; z-index: 100;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-bar-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; align-items: stretch;
}
.tab-btn {
  flex: none; padding: 13px 18px;
  font-size: 12.5px; font-weight: 600; font-family: 'Noto Sans Thai', sans-serif;
  color: var(--text-light); border: none; background: none; cursor: pointer;
  border-bottom: 2.5px solid transparent; margin-bottom: -1.5px;
  white-space: nowrap; transition: color .15s, border-color .15s;
  display: flex; align-items: center; gap: 6px;
}
.tab-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--violet); border-bottom-color: var(--violet); }

/* ═══ CONTENT WRAPPER ══════════════════════════════════════════ */
.content { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }

/* ═══ SECTION HEADING ══════════════════════════════════════════ */
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin: 24px 0 14px;
}
.sh-label { font-size: 11px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: .7px; white-space: nowrap; }
.sh-line { flex: 1; height: 1px; background: var(--border); }
.sh-en { font-size: 10px; color: var(--text-light); white-space: nowrap; }

/* ═══ CARD BASE ════════════════════════════════════════════════ */
.card {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card + .card { margin-top: 10px; }
.card-hdr {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: #f8fafc; font-size: 12px; font-weight: 700; color: var(--navy-mid);
  display: flex; align-items: center; gap: 8px;
}
.card-hdr svg { width: 14px; height: 14px; color: var(--violet); flex-shrink: 0; }
.card-body { padding: 14px 16px; }

/* ═══ EXTENSION NOTICE ═════════════════════════════════════════ */
.ext-notice {
  background: var(--blue-soft); border: 1px solid #b8d4f0;
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 12px;
  margin-bottom: 16px;
}
.ext-icon { font-size: 24px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
.ext-label { font-size: 10.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.ext-num { font-size: 22px; font-weight: 800; color: var(--navy-mid); font-family: 'IBM Plex Mono', monospace; line-height: 1; }
.ext-desc { font-size: 11.5px; color: var(--text-mid); margin-top: 4px; line-height: 1.5; }

/* ═══ TODAY DUTY CARDS ═════════════════════════════════════════ */
.duty-group { margin-bottom: 10px; }
.duty-group-hdr {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
  font-size: 11px; font-weight: 700; color: var(--text-light);
  text-transform: uppercase; letter-spacing: .6px;
}
.duty-group-hdr::after { content:''; flex:1; height:1px; background:var(--border); }
.duty-person {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-sm); margin-bottom: 8px;
  display: flex; align-items: stretch;
}
.duty-color-bar { width: 4px; flex-shrink: 0; }
.duty-main { flex: 1; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.duty-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: #fff; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.duty-info { flex: 1; min-width: 0; }
.duty-name { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.25; }
.duty-nick { font-size: 11px; color: var(--text-light); margin-top: 1px; }
.duty-role-chip {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; margin-top: 4px;
}
.role-head { background: var(--amber-soft); color: var(--amber); border: 1px solid #e8c96a; }
.role-vice { background: var(--success-soft); color: var(--success); border: 1px solid #8fd0b0; }
.duty-shift-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 20px; flex-shrink: 0;
}
.duty-actions { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 12px; border-left: 1px solid var(--border); }
.action-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; font-size: 16px; transition: transform .15s;
  border: 1px solid var(--border);
}
.action-btn:active { transform: scale(.9); }
.btn-call { background: var(--success-soft); border-color: #a5d6b8; }
.btn-sms  { background: var(--blue-soft);    border-color: #aac8ee; }

/* ═══ STAFF GRID ═══════════════════════════════════════════════ */
.staff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 600px) { .staff-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 800px) { .staff-grid { grid-template-columns: repeat(4, 1fr); } }
.staff-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  overflow: hidden; display: flex; flex-direction: column;
}
.staff-card-top {
  padding: 14px 12px 10px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 8px;
}
.staff-avatar {
  width: 50px; height: 50px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,.2);
}
.staff-name { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }
.staff-nick { font-size: 11px; color: var(--text-light); }
.staff-today-shift {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 20px; margin-top: 2px;
}
.staff-card-foot {
  padding: 8px 10px; border-top: 1px solid var(--border);
  background: #f8fafc; display: flex; align-items: center; justify-content: space-between;
}
.staff-phone-link {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px; font-weight: 500; color: var(--blue);
  text-decoration: none;
}
.staff-phone-link:hover { text-decoration: underline; }

/* ═══ SCHEDULE TABLE ═══════════════════════════════════════════ */
.table-wrap {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table-scroll::-webkit-scrollbar { height: 5px; }
.table-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
table { border-collapse: collapse; min-width: 100%; }
thead th {
  background: var(--navy-mid); color: #fff;
  font-size: 11px; font-weight: 700; font-family: 'IBM Plex Mono', monospace;
  padding: 9px 7px; text-align: center; white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,.08);
  position: sticky; top: 0;
}
thead th.th-name {
  text-align: left; padding-left: 14px;
  min-width: 160px; left: 0; z-index: 20;
  background: var(--navy); border-right: 2px solid rgba(255,255,255,.15);
  font-family: 'Noto Sans Thai', sans-serif;
}
thead th.th-today { background: var(--amber); color: #fff; }
thead th.th-sun { color: #ffb3b3; }
thead th.th-sat { color: #b3d4ff; }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f5f8ff; }
tbody tr:nth-child(even) { background: #f8fafc; }
tbody tr:nth-child(even):hover { background: #f0f5ff; }
tbody td {
  font-size: 11.5px; padding: 8px 6px;
  text-align: center; white-space: nowrap;
  border-right: 1px solid var(--border);
}
tbody td.td-name {
  text-align: left; padding-left: 12px;
  position: sticky; left: 0;
  border-right: 2px solid var(--border);
  background: inherit; z-index: 5;
}
tbody tr:nth-child(even) td.td-name { background: #f8fafc; }
tbody tr:hover td.td-name { background: #f5f8ff; }
tbody td.td-today { background: #fdf4dc !important; }
tbody td.td-today .shift { border: 1.5px solid var(--amber); }
/* row highlight ถ้า filter */
tbody tr.dim { opacity: .25; }

/* shift badges */
.shift {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 46px; padding: 3px 5px; border-radius: var(--radius-sm);
  font-size: 10px; font-weight: 700; font-family: 'IBM Plex Mono', monospace;
  line-height: 1.2;
}
.s-ch1   { background: var(--blue-soft);    color: #0b4c9e; }
.s-ch2   { background: var(--success-soft); color: #0f5c32; }
.s-ch3   { background: var(--violet-soft);  color: #4a1fa8; }
.s-ems   { background: var(--red-soft);     color: #8b1a1a; }
.s-d     { background: var(--amber-soft);   color: #7a4f00; }
.s-other { background: var(--bg2);          color: var(--text-mid); }

/* ═══ FILTER ROW ════════════════════════════════════════════════ */
.filter-row {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
  margin-bottom: 12px; -ms-overflow-style: none; scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: none; padding: 6px 13px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--card);
  font-size: 11.5px; font-weight: 600; font-family: 'Noto Sans Thai', sans-serif;
  color: var(--text-mid); cursor: pointer; transition: all .15s; white-space: nowrap;
}
.filter-chip.active { background: var(--violet); border-color: var(--violet); color: #fff; }
.filter-chip:hover:not(.active) { border-color: var(--violet); color: var(--violet); }

/* ═══ LEGEND ════════════════════════════════════════════════════ */
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.legend-item {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 5px 10px;
  font-size: 11px; font-weight: 600; color: var(--text-mid);
}
.l-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ═══ MONTH INFO CARD ══════════════════════════════════════════ */
.month-card {
  background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-light) 100%);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.mc-icon { font-size: 26px; flex-shrink: 0; }
.mc-title { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.2; }
.mc-sub { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 3px; }
.mc-badge {
  margin-left: auto; background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2); color: #fff;
  font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 20px;
  white-space: nowrap;
}

/* ═══ LOADING / EMPTY / ERROR ══════════════════════════════════ */
.loading-wrap { text-align: center; padding: 50px 20px; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--violet);
  animation: spin .7s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 12px; color: var(--text-light); }
.empty { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-text { font-size: 13px; }
.error-box {
  background: var(--danger-soft); border: 1px solid #e8aaaa;
  border-radius: var(--radius); padding: 14px 16px;
  font-size: 12.5px; color: var(--danger);
  display: flex; gap: 10px; align-items: flex-start;
}

/* ═══ FAB REFRESH ══════════════════════════════════════════════ */
.fab {
  position: fixed; bottom: 24px; right: 18px;
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--violet); color: #fff; border: none; cursor: pointer;
  font-size: 19px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(109,63,192,.4);
  transition: transform .2s; z-index: 300;
}
.fab:active { transform: scale(.9); }
.fab.spin { animation: spin .6s linear infinite; }

/* ═══ RESPONSIVE ════════════════════════════════════════════════ */
@media (max-width: 480px) {
  .header-inner { gap: 10px; }
  .main-title { font-size: 12.5px; }
  .content { padding: 14px 12px 32px; }
  .ts-chips { display: none; }
}
</style>
</head>
<body>

<!-- ─── HEADER ─────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-logo-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/>
        <line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="8.01" y2="18"/>
      </svg>
    </div>
    <div class="header-titles">
      <div class="main-title">ตารางเวรยานพาหนะ — โรงพยาบาลสันทราย</div>
      <div class="sub-title">Work Schedule · งานยานพาหนะ กลุ่มงานบริหารทั่วไป</div>
    </div>
    <span class="header-chip" id="month-chip">--</span>
  </div>
</header>

<!-- ─── TODAY STRIP ─────────────────────────────────────────────── -->
<div class="today-strip" id="today-strip">
  <div class="ts-dot"></div>
  <div>
    <div class="ts-text" id="ts-text">เวรวันนี้</div>
    <div class="ts-sub" id="ts-sub"></div>
  </div>
  <div class="ts-chips" id="ts-chips"></div>
</div>

<!-- ─── TAB BAR ─────────────────────────────────────────────────── -->
<div class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn active" id="tbtn-today" onclick="showTab('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      วันนี้
    </button>
    <button class="tab-btn" id="tbtn-schedule" onclick="showTab('schedule')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      ตารางเวร
    </button>
    <button class="tab-btn" id="tbtn-staff" onclick="showTab('staff')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      ทีมงาน
    </button>
  </div>
</div>

<!-- ─── CONTENT ──────────────────────────────────────────────────── -->
<div class="content">

  <!-- ══ TAB: วันนี้ ══ -->
  <div id="tab-today">
    <div id="today-loading" class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">กำลังโหลดข้อมูล...</div>
    </div>
    <div id="today-content" style="display:none"></div>
  </div>

  <!-- ══ TAB: ตารางเวร ══ -->
  <div id="tab-schedule" style="display:none">
    <div id="sched-loading" class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">กำลังโหลดตาราง...</div>
    </div>
    <div id="sched-content" style="display:none"></div>
  </div>

  <!-- ══ TAB: ทีมงาน ══ -->
  <div id="tab-staff" style="display:none">
    <div id="staff-loading" class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">กำลังโหลดข้อมูล...</div>
    </div>
    <div id="staff-content" style="display:none"></div>
  </div>

</div>

<button class="fab" id="fab" onclick="reload()" title="รีเฟรช">↻</button>

<script>
// ─── CONFIG ─────────────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxtlZrDRogQiHUQiA_LsM7iFJ2Han6pYFbVXFsNucogZ785eqYqQT5YTTghiy6yac71/exec';

// ─── CONSTANTS ──────────────────────────────────────────────────
const MONTH_TH = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DOW_TH   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const DOW_SHORT= ['อา','จ','อ','พ','พฤ','ศ','ส'];
const COLORS   = ['#163251','#007a6e','#6d3fc0','#d4580a','#c0392b','#1d6fb5','#1a8a4a','#c07a00','#0d2137','#8255d4'];

// ─── STATE ──────────────────────────────────────────────────────
let scheduleData = null;
let todayData    = null;
let activeTab    = 'today';
let activeFilter = 'all';

// ─── UTILS ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const avatarColor  = i  => COLORS[i % COLORS.length];
const avatarLetter = name => (name || '?').replace(/^(นาย|นาง|นางสาว)\.?\s*/,'').trim().charAt(0);

function shiftClass(s) {
  if (!s) return '';
  const l = s.toLowerCase();
  if (l.includes('ems')) return 's-ems';
  if (l.startsWith('ช1')) return 's-ch1';
  if (l.startsWith('ช2')) return 's-ch2';
  if (l.startsWith('ช3')) return 's-ch3';
  if (l === 'ด' || l.startsWith('ด')) return 's-d';
  return 's-other';
}
function shiftLabel(s) {
  if (!s) return '';
  const l = s.toLowerCase();
  if (l.includes('ems')) return '🚑';
  if (l.startsWith('ช1')) return '🔵';
  if (l.startsWith('ช2')) return '🟢';
  if (l.startsWith('ช3')) return '🟣';
  if (l === 'ด' || l.startsWith('ด')) return '🌙';
  return '⚪';
}
function shiftName(s) {
  if (!s) return '';
  const l = s.toLowerCase();
  if (l.includes('ems')) return 'เวร EMS';
  if (l.startsWith('ช1')) return 'เวรเช้า มือ 1';
  if (l.startsWith('ช2')) return 'เวรเช้า มือ 2';
  if (l.startsWith('ช3')) return 'เวรเช้า มือ 3';
  if (l === 'ด' || l.startsWith('ด')) return 'เวรดึก';
  return s;
}

// ─── FETCH ──────────────────────────────────────────────────────
async function api(action) {
  const r = await fetch(`${GAS_URL}?action=${action}`);
  return r.json();
}

// ─── INIT ────────────────────────────────────────────────────────
async function init() {
  const [td, sc] = await Promise.allSettled([
    api('getTodayDuty'),
    api('getSchedule'),
  ]);
  if (td.status === 'fulfilled' && td.value.status === 'ok') {
    todayData = td.value;
    renderTodayStrip(todayData);
    renderTodayTab(todayData);
  } else {
    $('today-loading').innerHTML = err('โหลดข้อมูลวันนี้ไม่สำเร็จ');
  }
  if (sc.status === 'fulfilled' && sc.value.status === 'ok') {
    scheduleData = sc.value;
    renderScheduleTab(scheduleData);
    renderStaffTab(scheduleData);
  } else {
    $('sched-loading').innerHTML = err('โหลดตารางไม่สำเร็จ — กรุณาเรียก setupWorktableSheet ก่อน');
    $('staff-loading').innerHTML = err('โหลดข้อมูลไม่สำเร็จ');
  }
}

function err(msg) {
  return `<div class="error-box">⚠ ${msg}</div>`;
}

// ─── TODAY STRIP ─────────────────────────────────────────────────
function renderTodayStrip(d) {
  const today = new Date();
  $('month-chip').textContent = `${MONTH_TH[+d.month]} ${d.year}`;
  $('ts-text').textContent    = `เวรวันนี้ — วัน${d.dow}ที่ ${d.day}`;
  $('ts-sub').textContent     = `${MONTH_TH[+d.month]} พ.ศ. ${d.year} • ต่อ ${d.extension||'207'}`;

  const chips = $('ts-chips');
  chips.innerHTML = '';
  (d.onDuty || []).slice(0,5).forEach(p => {
    const isEms = (p.shift||'').toLowerCase().includes('ems');
    chips.innerHTML += `<div class="ts-chip${isEms?' ems':''}">${shiftLabel(p.shift)} ${p.nick||p.name.replace(/^(นาย|นาง)/,'')}</div>`;
  });
  $('today-strip').classList.add('show');
}

// ─── TODAY TAB ───────────────────────────────────────────────────
function renderTodayTab(d) {
  $('today-loading').style.display = 'none';
  $('today-content').style.display = 'block';
  const ext   = d.extension || '207';
  const onDuty= d.onDuty || [];

  // group by shift
  const groups = {};
  onDuty.forEach(p => {
    const k = p.shift || 'อื่นๆ';
    if (!groups[k]) groups[k] = [];
    groups[k].push(p);
  });

  let html = `
  <div class="ext-notice">
    <div class="ext-icon">📞</div>
    <div>
      <div class="ext-label">เบอร์ภายในงานยานพาหนะ</div>
      <div class="ext-num">ต่อ ${ext}</div>
      <div class="ext-desc">ติดต่อประสานงานขอใช้รถ ส่งต่อผู้ป่วย หรืองานอื่น ๆ ได้ตลอด 24 ชั่วโมง</div>
    </div>
  </div>`;

  if (!onDuty.length) {
    html += `<div class="empty"><div class="empty-icon">😴</div><div class="empty-text">ไม่พบข้อมูลผู้เวรวันนี้</div></div>`;
  } else {
    const shiftOrder = ['ช1บ2','ช2บ1','ช3(Ems)','ด','อื่นๆ'];
    const keys = [...new Set([...shiftOrder.filter(k => groups[k]), ...Object.keys(groups).filter(k => !shiftOrder.includes(k))])];

    keys.forEach(shift => {
      const members = groups[shift];
      html += `<div class="duty-group">
        <div class="duty-group-hdr">
          <span class="shift ${shiftClass(shift)}">${shift}</span> ${shiftName(shift)}
        </div>`;
      members.forEach((p, mi) => {
        const idx   = onDuty.indexOf(p);
        const color = avatarColor(idx);
        html += `
        <div class="duty-person">
          <div class="duty-color-bar" style="background:${color}"></div>
          <div class="duty-main">
            <div class="duty-avatar" style="background:${color}">${avatarLetter(p.name)}</div>
            <div class="duty-info">
              <div class="duty-name">${p.name}</div>
              <div class="duty-nick">(${p.nick||'—'})</div>
              ${p.role ? `<div class="duty-role-chip ${p.role.includes('รอง')?'role-vice':'role-head'}">${p.role}</div>` : ''}
            </div>
            <div class="duty-shift-badge shift ${shiftClass(shift)}">${shiftLabel(shift)} ${shift}</div>
          </div>
          <div class="duty-actions">
            <a href="tel:${p.phone}" class="action-btn btn-call" title="โทร">📞</a>
            <a href="sms:${p.phone}" class="action-btn btn-sms"  title="SMS">💬</a>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
  }

  $('today-content').innerHTML = html;
}

// ─── SCHEDULE TAB ────────────────────────────────────────────────
function renderScheduleTab(d) {
  $('sched-loading').style.display = 'none';
  $('sched-content').style.display = 'block';

  const staff  = d.data || [];
  const month  = +d.month  || new Date().getMonth()+1;
  const year   = +d.year   || new Date().getFullYear()+543;
  const daysInMonth = new Date(year-543, month, 0).getDate();
  const today  = new Date();
  const isThisMonth = today.getMonth()+1 === month;
  const todayDay    = today.getDate();

  // filter chips
  let filterHtml = `<button class="filter-chip active" onclick="setFilter('all',this)">👥 ทั้งหมด</button>`;
  staff.forEach(s => {
    const displayName = s.nick || s.name.replace(/^นาย\.?\s*/, '');
    filterHtml += `<button class="filter-chip" data-fname="${s.name}" onclick="setFilter(this.dataset.fname,this)">${displayName}</button>`;
  });

  // table head
  let headHtml = `<tr><th class="th-name">ชื่อ-สกุล</th>`;
  for (let d2=1; d2<=daysInMonth; d2++) {
    const dt  = new Date(year-543, month-1, d2);
    const dow = dt.getDay();
    const isTd = isThisMonth && d2 === todayDay;
    const cls  = isTd ? 'th-today' : dow===0 ? 'th-sun' : dow===6 ? 'th-sat' : '';
    headHtml += `<th class="${cls}">${d2}<br><span style="font-size:9px;font-weight:400;opacity:.7">${DOW_SHORT[dow]}</span></th>`;
  }
  headHtml += '</tr>';

  // table body
  let bodyHtml = '';
  staff.forEach((s,idx) => {
    const color = avatarColor(idx);
    bodyHtml += `<tr data-name="${s.name}">
      <td class="td-name">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:50%;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0">${avatarLetter(s.name)}</div>
          <div>
            <div style="font-size:12px;font-weight:700">${s.name}</div>
            <div style="font-size:10px;color:var(--text-light)">${s.nick||''}${s.role?` · ${s.role}`:''}</div>
          </div>
        </div>
      </td>`;
    for (let d2=1; d2<=daysInMonth; d2++) {
      const shift  = (s.schedule && s.schedule[String(d2)]) || '';
      const isTd   = isThisMonth && d2 === todayDay;
      bodyHtml += `<td class="${isTd?'td-today':''}">`;
      if (shift) bodyHtml += `<span class="shift ${shiftClass(shift)}">${shift}</span>`;
      bodyHtml += `</td>`;
    }
    bodyHtml += '</tr>';
  });

  $('sched-content').innerHTML = `
    <div class="month-card">
      <div class="mc-icon">🗓</div>
      <div>
        <div class="mc-title">${MONTH_TH[month]} พ.ศ. ${year}</div>
        <div class="mc-sub">งานยานพาหนะ โรงพยาบาลสันทราย</div>
      </div>
      <div class="mc-badge">${staff.length} คน</div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="l-dot" style="background:#e8f1fb;border:1px solid #aac8ee"></div>เช้า มือ 1 (ช1)</div>
      <div class="legend-item"><div class="l-dot" style="background:#e4f5eb;border:1px solid #a5d6b8"></div>เช้า มือ 2 (ช2)</div>
      <div class="legend-item"><div class="l-dot" style="background:#f0ecfb;border:1px solid #c5aff0"></div>เช้า มือ 3 (ช3)</div>
      <div class="legend-item"><div class="l-dot" style="background:#fdecea;border:1px solid #e8aaaa"></div>EMS</div>
      <div class="legend-item"><div class="l-dot" style="background:#fdf4dc;border:1px solid #e8d080"></div>ดึก (ด)</div>
      <div class="legend-item"><div class="l-dot" style="background:#fdf4dc;border:2px solid var(--amber)"></div>วันนี้</div>
    </div>
    <div class="filter-row" id="filter-row">${filterHtml}</div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>${headHtml}</thead>
          <tbody id="sched-body">${bodyHtml}</tbody>
        </table>
      </div>
    </div>`;

  // scroll to today
  setTimeout(() => {
    const todayTh = document.querySelector('thead .th-today');
    if (todayTh) {
      const scrollEl = document.querySelector('.table-scroll');
      if (scrollEl) scrollEl.scrollLeft = Math.max(0, todayTh.offsetLeft - 170);
    }
  }, 200);
}

function setFilter(name, btn) {
  activeFilter = name;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#sched-body tr').forEach(row => {
    const rn = row.getAttribute('data-name');
    row.classList.toggle('dim', name !== 'all' && name !== rn);
  });
}

// ─── STAFF TAB ───────────────────────────────────────────────────
function renderStaffTab(d) {
  $('staff-loading').style.display = 'none';
  $('staff-content').style.display = 'block';

  const staff  = d.data || [];
  const day    = String(new Date().getDate());

  let html = '<div class="staff-grid">';
  staff.forEach((s,idx) => {
    const color      = avatarColor(idx);
    const todayShift = (s.schedule && s.schedule[day]) || '';
    const tel        = s.phone ? `tel:${s.phone}` : '#';
    html += `
    <div class="staff-card">
      <div class="staff-card-top">
        <div class="staff-avatar" style="background:${color}">${avatarLetter(s.name)}</div>
        <div>
          <div class="staff-name">${s.name}</div>
          <div class="staff-nick">(${s.nick||'—'})</div>
          ${s.role ? `<div style="margin-top:4px"><span class="duty-role-chip ${s.role.includes('รอง')?'role-vice':'role-head'}">${s.role}</span></div>` : ''}
          ${todayShift
            ? `<div class="staff-today-shift shift ${shiftClass(todayShift)}">${shiftLabel(todayShift)} ${todayShift}</div>`
            : `<div style="font-size:10px;color:var(--text-light);margin-top:4px">ไม่มีเวรวันนี้</div>`}
        </div>
      </div>
      <div class="staff-card-foot">
        <a href="${tel}" class="staff-phone-link">${s.phone||'—'}</a>
        <a href="${tel}" style="font-size:17px;text-decoration:none">📞</a>
      </div>
    </div>`;
  });
  html += '</div>';

  $('staff-content').innerHTML = html;
}

// ─── TAB SWITCHER ────────────────────────────────────────────────
function showTab(tab) {
  ['today','schedule','staff'].forEach(t => {
    $('tab-'+t).style.display   = t === tab ? '' : 'none';
    $('tbtn-'+t).classList.toggle('active', t === tab);
  });
  activeTab = tab;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (tab === 'schedule') {
    setTimeout(() => {
      const todayTh = document.querySelector('thead .th-today');
      if (todayTh) {
        const scrollEl = document.querySelector('.table-scroll');
        if (scrollEl) scrollEl.scrollLeft = Math.max(0, todayTh.offsetLeft - 170);
      }
    }, 100);
  }
}

// ─── RELOAD ──────────────────────────────────────────────────────
async function reload() {
  const fab = $('fab');
  fab.classList.add('spin');
  scheduleData = null; todayData = null;
  ['today','schedule','staff'].forEach(t => {
    $(`${t}-loading`).style.display = 'block';
    $(`${t}-loading`).innerHTML = '<div class="spinner"></div><div class="loading-text">กำลังโหลด...</div>';
    $(`${t}-content`).style.display = 'none';
  });
  $('today-strip').classList.remove('show');
  await init();
  fab.classList.remove('spin');
}

// ─── BOOT ─────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
